<script>/* SEO Studio web version (GitHub Pages): Gemini with the team key, downloads in the browser, data saved in this browser. */
(function(){
 const KEY='seobysaran_gemini_key';
 const getKey=()=>{if(window.EFL_TEAMKEY)return window.EFL_TEAMKEY;try{return localStorage.getItem(KEY)||''}catch(e){return ''}};
 const MODELS=['gemini-3.8-flash','gemini-3.8-flash-lite','gemini-3.5-flash','gemini-3.5-flash-lite','gemini-flash-latest','gemini-flash-lite-latest'];
 const busy=e=>e&&(e.status===503||e.status===500||/high demand|overload|unavailable|try again later/i.test(e.message||''));
 let good=null;
 function texts(o,out){if(!o||typeof o!=='object')return out;if(Array.isArray(o)){o.forEach(x=>texts(x,out));return out}
  for(const k in o){if(k==='thought'||k==='thoughts'||k==='thinking')continue;const v=o[k];if(k==='text'&&typeof v==='string')out.push(v);else if(typeof v==='object')texts(v,out)}return out}
 async function call(model,prompt,signal,mode){
  const key=getKey();if(!key)throw{code:'no_key'};
  let url,body;
  if(mode==='int'){url='https://generativelanguage.googleapis.com/v1beta/interactions';body={model,input:prompt}}
  else{url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent';body={contents:[{role:'user',parts:[{text:prompt}]}]}}
  const h={'Content-Type':'application/json','x-goog-api-key':key};if(mode==='int')h['Api-Revision']='2026-05-20';
  const r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(body),signal});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const m=(j.error&&j.error.message)||('HTTP '+r.status);throw{status:r.status,message:m}}
  const t=(typeof j.output_text==='string'&&j.output_text)||(mode==='int'?texts(j.outputs||j.output||j,[]).join(''):texts(j.candidates&&j.candidates[0]&&j.candidates[0].content||{},[]).join(''));
  if(!t)throw{message:'Empty answer from Gemini'};return t;
 }
 async function gemini(prompt,opts){
  opts=opts||{};const signal=opts.signal;
  const all=[].concat(...MODELS.map(m=>[[m,'int'],[m,'gen']]));const tries=good?[good].concat(all.filter(x=>x[0]!==good[0]||x[1]!==good[1])):all;
  let last,nb=0;
  for(const [m,mode] of tries){
   try{const t=await call(m,prompt,signal,mode);good=[m,mode];return {text:t}}
   catch(e0){let e=e0;if(e&&(e.name==='AbortError'||e.code==='no_key'))throw e;
    if(busy(e)){nb++;if(nb>=4){last=e;break}if(nb===1)await new Promise(r=>setTimeout(r,1200))}
    last=e;if(busy(e)&&good&&good[0]===m){good=null;continue}
    if(e&&e.status===429)throw{code:'rate_limited'};
    if(e&&(e.status===400||e.status===401||e.status===403)&&/key|permission|denied|unauth/i.test(e.message||''))throw{message:'The AI key did not work: '+e.message+'. Click "AI key" at the bottom right to check it.'};
    if(good&&!busy(e))throw e}
  }
  if(busy(last))throw{code:'busy',message:'Google AI is very busy right now. Wait a minute and try again.'};
  throw last||{message:'Gemini did not answer'};
 }
 function linkDl(filename,data){const b=data instanceof Blob?data:new Blob([data],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
 window.claude={use:async n=>{
  if(n==='sample')return gemini;
  if(n==='downloads')return {save:async({filename,data})=>linkDl(filename,data)};
  return null}};
 window.__gemini=gemini;window.__linkDl=linkDl;
 window.EFL_WEB={getKey,setKey:k=>{try{localStorage.setItem(KEY,k.trim())}catch(e){}good=null},test:async()=>{const r=await gemini('Reply with the single word: ready');return r.text}};
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--p:#5E42C0;--pd:#4E2FBB;--pdd:#33208A;--pl:#F2EEFB;--pll:#F8F6FD;--ink:#1F1D26;--g:#363636;--mut:#6B6880;--line:#E6E2F0;--bg:#F7F6FB;--ok:#16A34A;--okl:#E8F7EE;--warn:#D97706;--warnl:#FEF3E2;--bad:#DC2626;--badl:#FDECEC;--blue:#2563EB;--bluel:#EAF1FE}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:Montserrat,Inter,sans-serif;margin:0;letter-spacing:-.2px}
a{color:var(--p)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* layout */
#app{display:flex;min-height:100vh}
#side{width:252px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 18px 10px;display:flex;align-items:center;gap:10px}
.brand img{height:34px;display:block}
.brand small{font-size:10px;font-weight:700;color:var(--p);background:var(--pl);padding:2px 7px;border-radius:99px;letter-spacing:.4px;text-transform:uppercase}
.projbox{margin:6px 14px 10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--pll)}
.projbox label{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.projbox select{width:100%;margin-top:4px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600}
.projbox .add{margin-top:8px;width:100%;background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px;font-weight:700;cursor:pointer}
.projbox .add:disabled{background:#C9C2E3;cursor:not-allowed}
.projbox .note{font-size:11px;color:var(--mut);margin-top:5px;text-align:center}
nav.menu{padding:4px 10px 20px;flex:1}
.grp{margin-top:10px}
.grp>button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:7px 8px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;cursor:pointer}
.grp>button::after{content:"▾";font-size:10px}
.grp.shut>button::after{content:"▸"}
.grp.shut .items{display:none}
.items a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--g);font-weight:500;font-size:13.5px}
.items a:hover{background:var(--pll)}
.items a.on{background:var(--pl);color:var(--p);font-weight:700}
.tg{margin-left:auto;font-size:9.5px;font-weight:700;border-radius:99px;padding:1px 6px;letter-spacing:.3px}
.tg.ai{background:var(--pl);color:var(--p)}
.tg.soon{background:#F1F0F4;color:#8A869B}
.sidefoot{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
#top h1{font-size:18px}
#top .crumbs{font-size:12px;color:var(--mut)}
.topr{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;text-decoration:none;font-size:13px}
.menubtn{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
#main{padding:24px;max-width:1180px;width:100%}
#banner{margin:16px 24px 0;padding:10px 14px;border-radius:10px;background:var(--warnl);color:#92400E;font-size:13px}
/* ui */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13.5px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.p{background:var(--p);color:#fff}
.btn.p:hover{background:var(--pd)}
.btn.o{background:#fff;color:var(--p);border-color:#D8D0F0}
.btn.o:hover{border-color:var(--p)}
.btn.q{background:none;color:var(--mut);padding:6px 8px}
.btn.d{background:#fff;color:var(--bad);border-color:#F3C9C9}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.card h2{font-size:17px;margin-bottom:4px}
.card h3{font-size:15px;margin-bottom:8px}
.sub{color:var(--mut);margin:0 0 14px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.fld{margin-bottom:14px}
.fld label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.fld .hint{font-size:12px;color:var(--mut);margin-top:4px}
input[type=text],input[type=url],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:14px}
textarea{min-height:110px;resize:vertical;font-family:inherit}
textarea.mono,pre.out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p)}
pre.out{background:#1E1B2E;color:#EDE9FE;border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-word;margin:0;max-height:460px;overflow:auto}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--pl);color:var(--p)}
.pill.ok{background:var(--okl);color:var(--ok)}
.pill.bad{background:var(--badl);color:var(--bad)}
.pill.warn{background:var(--warnl);color:var(--warn)}
.pill.blue{background:var(--bluel);color:var(--blue)}
.pill.grey{background:#F1F0F4;color:#6B6880}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--pll)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.me td{background:#F6F3FF;font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.empty{text-align:center;padding:36px 20px;color:var(--mut)}
/* hero */
.hero{background:linear-gradient(135deg,var(--pdd),var(--p) 65%,#7B61D8);color:#fff;border-radius:16px;padding:26px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h2{font-size:24px;margin-bottom:6px}
.hero p{opacity:.9;margin:0 0 16px;max-width:620px}
.hero .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;opacity:.9;margin-bottom:16px}
.hero .btn.w{background:#fff;color:var(--p)}
.hero .btn.g{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.45)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
/* metrics */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.tile .k{font-size:12px;color:var(--mut);font-weight:600}
.tile .v{font-family:Montserrat;font-size:24px;font-weight:800;margin-top:2px}
.tile .d{font-size:12px;font-weight:700;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--mut)}
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .lab{font-size:12px;color:var(--mut);font-weight:600;margin-top:-6px}
.bars .b{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bars .b .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .tr{height:10px;background:#EFECF7;border-radius:99px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--p);border-radius:99px}
.bars .b.me .tr i{background:var(--blue)}
.bars .b.me .l{font-weight:700;color:var(--blue)}
.bars .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.take{margin:0;padding:0;list-style:none}
.take li{padding:9px 0 9px 26px;border-bottom:1px solid var(--line);position:relative}
.take li:last-child{border-bottom:0}
.take li:before{content:"";position:absolute;left:4px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--p)}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:7px;padding:3px 8px;margin:2px 3px 2px 0;white-space:nowrap}
.c-nc{background:#DCFCE7;color:#15803D}.c-n{background:var(--bluel);color:var(--blue)}.c-c{background:var(--warnl);color:var(--warn)}.c-a{background:#F1F0F4;color:#8A869B}.c-x{background:var(--badl);color:var(--bad)}
.qrow{cursor:pointer}
.qrow:hover td{background:var(--pll)}
.qdet td{background:#FCFBFF}
.qdet ol{margin:4px 0 8px 18px;padding:0}
.qdet .ex{color:var(--mut);font-size:12.5px;white-space:pre-wrap}
.gap{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}
.gap h4{font-size:14px;margin-bottom:4px}
.gap .ev{font-size:12.5px;color:var(--mut);margin:6px 0}
.choice{border:1.5px solid var(--line);border-radius:14px;padding:18px;background:#fff}
.choice h3{font-size:16px;margin:8px 0 4px}
.choice ul{margin:8px 0 14px;padding-left:18px;color:var(--mut);font-size:13px}
.step{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.step b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pl);color:var(--p);display:flex;align-items:center;justify-content:center;font-size:12px}
.prog{height:8px;background:#EFECF7;border-radius:99px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:var(--p);transition:width .3s}
.log{font-size:12.5px;color:var(--mut);max-height:160px;overflow:auto;margin-top:8px}
.qedit{display:grid;grid-template-columns:1fr 190px 34px;gap:8px;margin-bottom:8px;align-items:center}
.x{background:none;border:1px solid var(--line);border-radius:8px;height:36px;cursor:pointer;color:var(--mut)}
.x:hover{color:var(--bad);border-color:var(--bad)}
.serp{font-family:Arial,sans-serif;max-width:600px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.serp .u{font-size:12px;color:#202124;display:flex;gap:8px;align-items:center}
.serp .fav{width:26px;height:26px;border-radius:50%;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--p);font-weight:700}
.serp .t{color:#1a0dab;font-size:20px;line-height:1.3;margin:6px 0 3px}
.serp .ds{color:#4d5156;font-size:14px;line-height:1.58}
.meter{font-size:12px;margin-top:4px;display:flex;gap:8px;align-items:center}
.meter .tr{flex:1;height:6px;background:#EFECF7;border-radius:99px;overflow:hidden}
.meter .tr i{display:block;height:100%}
mark{background:#FDE68A;border-radius:3px;padding:0 2px}
mark.ban{background:#FECACA}
.preview{border:1px solid var(--line);border-radius:10px;padding:14px;max-height:340px;overflow:auto;white-space:pre-wrap;background:#fff;font-size:13.5px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.soon{max-width:760px}
.soonico{width:52px;height:52px;border-radius:14px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:24px}
/* onboarding */
#onboard{position:fixed;inset:0;background:linear-gradient(160deg,#F5F2FD,#fff 50%);z-index:50;overflow-y:auto}
.ob{max-width:620px;margin:0 auto;padding:40px 20px}
.ob .logo{mix-blend-mode:multiply;height:46px;display:block;margin:0 auto 20px}
.obcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 10px 40px rgba(78,47,187,.08)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.dots i{width:28px;height:5px;border-radius:99px;background:#E4DEF5}
.dots i.on{background:var(--p)}
.obcard h2{font-size:22px;text-align:center;margin-bottom:6px}
.obcard .sub{text-align:center}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-weight:600;font-size:13px;background:#fff}
.opt.on{border-color:var(--p);background:var(--pl);color:var(--p)}
.obnav{display:flex;justify-content:space-between;margin-top:20px}
.safe{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}
/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(20,16,40,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
#modal .box{background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%}
#modal h3{margin-bottom:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;transition:transform .25s;z-index:70;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
.spin.dk{border-color:#E4DEF5;border-top-color:var(--p)}
@keyframes sp{to{transform:rotate(360deg)}}
/* glossary */
.gl-tools{position:sticky;top:62px;z-index:5;background:var(--bg);padding:10px 0 12px}
.gl-cat{margin-bottom:24px;scroll-margin-top:200px}
.gl-cat h2{font-size:18px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.gl-list{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gl-list .gr{border-top:1px solid var(--line)}
.gl-list .gr:first-child{border-top:0}
.rin{display:flex;gap:12px;align-items:flex-start;padding:12px 16px}
.rin input{margin-top:4px;width:18px;height:18px;accent-color:var(--p);flex:none;cursor:pointer}
.num{font-size:11.5px;font-weight:700;color:#8F7AD9;margin-top:3px;min-width:26px}
.txt{flex:1;min-width:0}
.term{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.txt strong{font-size:15px}
.def{display:none;color:var(--mut);margin-top:5px;padding:8px 12px;background:var(--pl);border-radius:8px;border-left:3px solid var(--p)}
.gr.open .def{display:block}
.show{flex:none;background:#fff;border:1.5px solid var(--line);color:var(--p);border-radius:8px;padding:4px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.gr.done strong{color:var(--mut)}
.gr.done .num{color:var(--ok)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.chips button.on{background:var(--p);color:#fff;border-color:var(--p)}
.tog{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer}
.tog input{accent-color:var(--p)}
.post{display:flex;gap:16px;align-items:center}
.post .th{width:120px;height:84px;border-radius:12px;background:linear-gradient(135deg,var(--pdd),var(--p));color:#fff;display:flex;align-items:center;justify-content:center;font-family:Montserrat;font-weight:800;font-size:22px;flex:none}
.dashtop{grid-template-columns:240px 1fr}
@media(max-width:980px){.g3{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
 #side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}
 #side.open{transform:none}
 .menubtn{display:block}
 .g2,.g3,.dashtop{grid-template-columns:1fr}
 #main{padding:16px}
 #top{padding:0 14px}
 .bars .b{grid-template-columns:110px 1fr 42px}
 .qedit{grid-template-columns:1fr 34px}.qedit select{grid-column:1}
 .opts{grid-template-columns:1fr 1fr}
}
#gate{position:fixed;inset:0;z-index:60;overflow-y:auto;background:linear-gradient(160deg,#F5F2FD,#fff 55%)}
.gwrap{max-width:440px;margin:0 auto;padding:56px 20px;text-align:center}
.glogo{height:46px;mix-blend-mode:multiply;margin-bottom:22px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 10px 40px rgba(78,47,187,.08)}
.gcard h2{font-size:21px;margin-bottom:6px}
.gcard .sub{color:var(--mut);font-size:14px;margin-bottom:16px}
.gbrands{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 18px}
.gbrands span{background:var(--pl);color:var(--pdd);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700}
.gcheck{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--mut);font-size:14px;padding:10px 0}
.guser{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.guser img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--pl)}
.guser b{display:block;font-size:14.5px}.guser span{font-size:13px;color:var(--mut);word-break:break-all}
.gok{background:var(--okl);color:var(--ok);font-weight:700;font-size:13.5px;border-radius:9px;padding:9px;margin-bottom:16px}
.gbtn{width:100%;padding:12px 16px;font-size:14.5px}
.gicon{width:52px;height:52px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
#admswitch{background:var(--pl);color:var(--pdd);border-color:#D9D0F5}
#admswitch.on{background:var(--p);color:#fff}
.qfill{display:flex;flex-wrap:wrap;gap:8px}
.qf{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.qf:hover{border-color:var(--p);color:var(--p)}
.qf.on{background:var(--p);border-color:var(--p);color:#fff}
.qf:disabled{opacity:.5;cursor:default;border-color:var(--line);color:var(--mut)}
#admtag{background:var(--pdd);color:#fff;font-size:11px;font-weight:800;letter-spacing:.6px;border-radius:99px;padding:5px 10px}
#avatar.isadm{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--pdd)}
.gicon.wait{background:var(--warnl);color:var(--warn)}
.ad-req{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap}
.ad-req .who{flex:1;min-width:200px}.ad-req .who b{display:block}.ad-req .who span{font-size:12.5px;color:var(--mut)}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:#fff;color:var(--bad);border-color:var(--bad)}
.gicon.bad{background:var(--badl);color:var(--bad)}
.gemail.bad{background:var(--badl);color:var(--bad);border-radius:9px;padding:9px;font-weight:700;font-size:13.5px;margin-bottom:14px;word-break:break-all}
.gnote{font-size:12.5px;color:var(--mut);margin-top:4px}
.gfoot{font-size:12px;color:var(--mut);margin-top:18px}
.crbox{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#FAF9FD}
[data-cri].on td{background:#F1EDFC}

.hm{position:relative;margin:-8px -8px 0;padding:34px 24px 26px;border-radius:20px;background:#FAF9FE;overflow:hidden;border:1px solid var(--line)}
.hm:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#D9D2F2 1px,transparent 1.2px);background-size:14px 14px;-webkit-mask-image:radial-gradient(ellipse 55% 55% at 50% 58%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 55% 55% at 50% 58%,#000 20%,transparent 75%);opacity:.9;pointer-events:none}
.hm>*{position:relative}
.hm-top{text-align:center;max-width:720px;margin:0 auto}
.hm-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--mut);box-shadow:0 2px 10px rgba(94,66,192,.06)}
.hm-dots{display:inline-flex;gap:3px}.hm-dots i{width:7px;height:7px;border-radius:50%;background:var(--p)}.hm-dots i:nth-child(2){background:#8B74E8}.hm-dots i:nth-child(3){background:#C4B5F5}
.hm-hi{margin-top:14px;font-size:14px;font-weight:600;color:var(--p)}
.hm h1{font-size:40px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 12px;color:var(--ink);font-weight:600}
.hm-top p{color:var(--mut);font-size:15px;line-height:1.6;margin:0 auto 18px;max-width:560px}
.hm-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hm-go{box-shadow:0 10px 28px rgba(94,66,192,.35)}.hm-go span{margin-left:6px}
.hm-hub{position:relative;max-width:1000px;margin:18px auto 0;aspect-ratio:1000/440}
.hm-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hm-orb{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;display:grid;place-items:center;text-decoration:none;
 background:radial-gradient(circle at 35% 30%,#8B74E8,#4E2FBB 55%,#2A1A72);box-shadow:0 0 0 10px rgba(139,116,232,.14),0 0 0 22px rgba(139,116,232,.07),0 18px 60px rgba(94,66,192,.55);animation:hmPulse 3.2s ease-in-out infinite}
.hm-ring{position:absolute;inset:16px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.45);animation:hmSpin 18s linear infinite}
.hm-core{width:52px;height:52px;border-radius:50%;background:#1C1442;color:#fff;font-weight:700;font-size:17px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.75);z-index:1}
@keyframes hmSpin{to{transform:rotate(360deg)}}
@keyframes hmPulse{50%{box-shadow:0 0 0 14px rgba(139,116,232,.16),0 0 0 30px rgba(139,116,232,.06),0 18px 70px rgba(94,66,192,.6)}}
.hm-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.hm-ic{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--p);border:3px solid #C9BCF4;box-shadow:0 0 0 6px rgba(201,188,244,.25),0 6px 18px rgba(94,66,192,.18);transition:.2s}
.hm-node b{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:999px;white-space:nowrap}
.hm-node:hover .hm-ic{transform:scale(1.08);border-color:var(--p);color:#fff;background:var(--p)}
.hm-feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:960px;margin:10px auto 0}
.hm-f{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 14px;border-radius:14px;text-decoration:none;color:var(--ink);transition:.2s}
.hm-f:hover{background:#fff;box-shadow:0 8px 24px rgba(94,66,192,.1)}
.hm-fi{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--p);box-shadow:0 3px 10px rgba(94,66,192,.1)}
.hm-f b{font-size:15px}.hm-f span:last-child{font-size:13px;color:var(--mut);line-height:1.5}
.hm-proj{display:flex;align-items:center;gap:28px;flex-wrap:wrap;max-width:960px;margin:18px auto 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.hm-proj div{display:flex;flex-direction:column}.hm-proj .sub{font-size:11.5px}.hm-proj b{font-size:14px}.hm-proj a{margin-left:auto}
@media(max-width:760px){.hm h1{font-size:28px}.hm-hub{aspect-ratio:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px;padding-top:120px}.hm-lines{display:none}
 .hm-orb{top:56px;width:90px;height:90px;margin:-45px 0 0 -45px}.hm-node{position:static;transform:none}.hm-node b{white-space:normal;text-align:center}.hm-feats{grid-template-columns:1fr}}
</style>
</head>

<script id="gl-data" type="text/html"><section class="gl-cat" data-cat="basics"><h2>Search basics <span class="pill count">0/10</span></h2><ol class="gl-list"><li class="gr" data-id="seo-search-engine-optimization" data-text="seo (search engine optimization)"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know SEO (Search Engine Optimization)"><span class="num">001</span><div class="txt"><button class="term" type="button"><strong>SEO (Search Engine Optimization)</strong></button><span class="def">Work that helps your pages show up higher in search results for the searches that matter to your business.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="search-intent" data-text="search intent"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Search intent"><span class="num">002</span><div class="txt"><button class="term" type="button"><strong>Search intent</strong></button><span class="def">The goal behind a search: to learn, to compare, to buy, or to find one website.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="keyword" data-text="keyword"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Keyword"><span class="num">003</span><div class="txt"><button class="term" type="button"><strong>Keyword</strong></button><span class="def">A word or phrase people type into a search box.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="long-tail-keyword" data-text="long-tail keyword"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Long-tail keyword"><span class="num">004</span><div class="txt"><button class="term" type="button"><strong>Long-tail keyword</strong></button><span class="def">A longer, more specific search with fewer monthly searches and a clearer goal.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="search-volume" data-text="search volume"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Search volume"><span class="num">005</span><div class="txt"><button class="term" type="button"><strong>Search volume</strong></button><span class="def">How many times a keyword is searched in a month, on average.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="keyword-difficulty" data-text="keyword difficulty"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Keyword difficulty"><span class="num">006</span><div class="txt"><button class="term" type="button"><strong>Keyword difficulty</strong></button><span class="def">A score for how hard it is to reach page one for a keyword.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="serp" data-text="serp"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know SERP"><span class="num">007</span><div class="txt"><button class="term" type="button"><strong>SERP</strong></button><span class="def">The search engine results page: everything Google shows after a search.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="serp-features" data-text="serp features"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know SERP features"><span class="num">008</span><div class="txt"><button class="term" type="button"><strong>SERP features</strong></button><span class="def">Extra blocks on a results page, such as maps, videos, People Also Ask and AI Overviews.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="organic-traffic" data-text="organic traffic"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Organic traffic"><span class="num">009</span><div class="txt"><button class="term" type="button"><strong>Organic traffic</strong></button><span class="def">Visits that come from unpaid search results.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="ranking-factors" data-text="ranking factors"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Ranking factors"><span class="num">010</span><div class="txt"><button class="term" type="button"><strong>Ranking factors</strong></button><span class="def">The signals Google uses to decide which page shows first.</span></div><button class="show" type="button">Show meaning</button></div></li></ol></section><section class="gl-cat" data-cat="content"><h2>Content and E-E-A-T <span class="pill count">0/11</span></h2><ol class="gl-list"><li class="gr" data-id="e-e-a-t" data-text="e-e-a-t"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know E-E-A-T"><span class="num">011</span><div class="txt"><button class="term" type="button"><strong>E-E-A-T</strong></button><span class="def">Experience, Expertise, Authoritativeness and Trust: the qualities Google looks for in a page and its author.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="helpful-content" data-text="helpful content"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Helpful content"><span class="num">012</span><div class="txt"><button class="term" type="button"><strong>Helpful content</strong></button><span class="def">Content written for people first, that answers the question in full.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="topical-authority" data-text="topical authority"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Topical authority"><span class="num">013</span><div class="txt"><button class="term" type="button"><strong>Topical authority</strong></button><span class="def">Covering one subject so well, across many pages, that search engines trust your site on it.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="pillar-page" data-text="pillar page"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Pillar page"><span class="num">014</span><div class="txt"><button class="term" type="button"><strong>Pillar page</strong></button><span class="def">A long main page on a broad topic that links out to every related article.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="topic-cluster" data-text="topic cluster"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Topic cluster"><span class="num">015</span><div class="txt"><button class="term" type="button"><strong>Topic cluster</strong></button><span class="def">A pillar page plus the shorter articles that cover each of its subtopics.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="content-gap" data-text="content gap"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Content gap"><span class="num">016</span><div class="txt"><button class="term" type="button"><strong>Content gap</strong></button><span class="def">A topic your competitors cover and you have not covered yet.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="thin-content" data-text="thin content"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Thin content"><span class="num">017</span><div class="txt"><button class="term" type="button"><strong>Thin content</strong></button><span class="def">A page with too little useful text to answer the search.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="duplicate-content" data-text="duplicate content"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Duplicate content"><span class="num">018</span><div class="txt"><button class="term" type="button"><strong>Duplicate content</strong></button><span class="def">The same or nearly the same text on more than one URL.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="keyword-cannibalization" data-text="keyword cannibalization"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Keyword cannibalization"><span class="num">019</span><div class="txt"><button class="term" type="button"><strong>Keyword cannibalization</strong></button><span class="def">Two or more of your own pages competing for the same search.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="content-refresh" data-text="content refresh"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Content refresh"><span class="num">020</span><div class="txt"><button class="term" type="button"><strong>Content refresh</strong></button><span class="def">Updating an old page with new facts, dates and sections so it ranks again.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="information-gain" data-text="information gain"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Information gain"><span class="num">021</span><div class="txt"><button class="term" type="button"><strong>Information gain</strong></button><span class="def">Facts, data or views your page adds that the other ranking pages lack.</span></div><button class="show" type="button">Show meaning</button></div></li></ol></section><section class="gl-cat" data-cat="onpage"><h2>On-page SEO <span class="pill count">0/12</span></h2><ol class="gl-list"><li class="gr" data-id="title-tag" data-text="title tag"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Title tag"><span class="num">022</span><div class="txt"><button class="term" type="button"><strong>Title tag</strong></button><span class="def">The clickable headline of your page in search results.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="meta-description" data-text="meta description"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Meta description"><span class="num">023</span><div class="txt"><button class="term" type="button"><strong>Meta description</strong></button><span class="def">The short summary under the title in search results. It affects clicks, not rankings.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="h1-tag" data-text="h1 tag"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know H1 tag"><span class="num">024</span><div class="txt"><button class="term" type="button"><strong>H1 tag</strong></button><span class="def">The main heading on a page. Use one per page.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="header-tags-h2-to-h6" data-text="header tags (h2 to h6)"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Header tags (H2 to H6)"><span class="num">025</span><div class="txt"><button class="term" type="button"><strong>Header tags (H2 to H6)</strong></button><span class="def">Subheadings that split a page into clear sections.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="url-slug" data-text="url slug"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know URL slug"><span class="num">026</span><div class="txt"><button class="term" type="button"><strong>URL slug</strong></button><span class="def">The part of a URL after the domain. Keep it short and readable.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="internal-linking" data-text="internal linking"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Internal linking"><span class="num">027</span><div class="txt"><button class="term" type="button"><strong>Internal linking</strong></button><span class="def">Links from one page on your site to another page on your site.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="anchor-text" data-text="anchor text"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Anchor text"><span class="num">028</span><div class="txt"><button class="term" type="button"><strong>Anchor text</strong></button><span class="def">The clickable words in a link.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="image-alt-text" data-text="image alt text"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Image alt text"><span class="num">029</span><div class="txt"><button class="term" type="button"><strong>Image alt text</strong></button><span class="def">A short text description of an image for screen readers and search engines.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="image-compression" data-text="image compression"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Image compression"><span class="num">030</span><div class="txt"><button class="term" type="button"><strong>Image compression</strong></button><span class="def">Making image files smaller so pages load faster.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="breadcrumbs" data-text="breadcrumbs"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Breadcrumbs"><span class="num">031</span><div class="txt"><button class="term" type="button"><strong>Breadcrumbs</strong></button><span class="def">A trail of links that shows where a page sits on your site.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="open-graph-tags" data-text="open graph tags"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Open Graph tags"><span class="num">032</span><div class="txt"><button class="term" type="button"><strong>Open Graph tags</strong></button><span class="def">Code that sets the title, image and text shown when a page is shared on social media.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="above-the-fold" data-text="above the fold"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Above the fold"><span class="num">033</span><div class="txt"><button class="term" type="button"><strong>Above the fold</strong></button><span class="def">The part of a page people see before they scroll.</span></div><button class="show" type="button">Show meaning</button></div></li></ol></section><section class="gl-cat" data-cat="crawl"><h2>Crawling and indexing <span class="pill count">0/15</span></h2><ol class="gl-list"><li class="gr" data-id="crawling" data-text="crawling"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Crawling"><span class="num">034</span><div class="txt"><button class="term" type="button"><strong>Crawling</strong></button><span class="def">Search engine bots visiting your pages and reading their content.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="googlebot" data-text="googlebot"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Googlebot"><span class="num">035</span><div class="txt"><button class="term" type="button"><strong>Googlebot</strong></button><span class="def">The name of Google&#x27;s crawler.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="crawlability" data-text="crawlability"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Crawlability"><span class="num">036</span><div class="txt"><button class="term" type="button"><strong>Crawlability</strong></button><span class="def">How easily bots can reach and read every page on your site.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="indexing" data-text="indexing"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Indexing"><span class="num">037</span><div class="txt"><button class="term" type="button"><strong>Indexing</strong></button><span class="def">Google storing a page so it can appear in search results.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="robots-txt" data-text="robots.txt"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know robots.txt"><span class="num">038</span><div class="txt"><button class="term" type="button"><strong>robots.txt</strong></button><span class="def">A file that tells bots which parts of a site they can and cannot crawl.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="xml-sitemap" data-text="xml sitemap"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know XML sitemap"><span class="num">039</span><div class="txt"><button class="term" type="button"><strong>XML sitemap</strong></button><span class="def">A file that lists the pages you want search engines to find.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="noindex-tag" data-text="noindex tag"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Noindex tag"><span class="num">040</span><div class="txt"><button class="term" type="button"><strong>Noindex tag</strong></button><span class="def">A tag that tells search engines to keep a page out of results.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="canonical-tag" data-text="canonical tag"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Canonical tag"><span class="num">041</span><div class="txt"><button class="term" type="button"><strong>Canonical tag</strong></button><span class="def">A tag that tells Google which URL is the main version of a page.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="crawl-budget" data-text="crawl budget"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Crawl budget"><span class="num">042</span><div class="txt"><button class="term" type="button"><strong>Crawl budget</strong></button><span class="def">How many pages Google will crawl on your site in a set time.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="orphan-page" data-text="orphan page"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Orphan page"><span class="num">043</span><div class="txt"><button class="term" type="button"><strong>Orphan page</strong></button><span class="def">A page with no internal links pointing to it.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="301-and-302-redirects" data-text="301 and 302 redirects"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know 301 and 302 redirects"><span class="num">044</span><div class="txt"><button class="term" type="button"><strong>301 and 302 redirects</strong></button><span class="def">A 301 moves a page for good. A 302 moves it for a short time.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="redirect-chain" data-text="redirect chain"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Redirect chain"><span class="num">045</span><div class="txt"><button class="term" type="button"><strong>Redirect chain</strong></button><span class="def">Several redirects in a row before a visitor reaches the final page.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="404-error" data-text="404 error"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know 404 error"><span class="num">046</span><div class="txt"><button class="term" type="button"><strong>404 error</strong></button><span class="def">The message a server sends when a page cannot be found.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="hreflang" data-text="hreflang"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Hreflang"><span class="num">047</span><div class="txt"><button class="term" type="button"><strong>Hreflang</strong></button><span class="def">A tag that tells Google which language or country version of a page to show.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="pagination" data-text="pagination"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Pagination"><span class="num">048</span><div class="txt"><button class="term" type="button"><strong>Pagination</strong></button><span class="def">Splitting a long list of items across numbered pages.</span></div><button class="show" type="button">Show meaning</button></div></li></ol></section><section class="gl-cat" data-cat="speed"><h2>Speed and page experience <span class="pill count">0/9</span></h2><ol class="gl-list"><li class="gr" data-id="core-web-vitals" data-text="core web vitals"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know Core Web Vitals"><span class="num">049</span><div class="txt"><button class="term" type="button"><strong>Core Web Vitals</strong></button><span class="def">Google&#x27;s three page experience scores: LCP, INP and CLS.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="lcp-largest-contentful-paint" data-text="lcp (largest contentful paint)"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know LCP (Largest Contentful Paint)"><span class="num">050</span><div class="txt"><button class="term" type="button"><strong>LCP (Largest Contentful Paint)</strong></button><span class="def">How fast the biggest item on screen loads. Aim for under 2.5 seconds.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="inp-interaction-to-next-paint" data-text="inp (interaction to next paint)"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know INP (Interaction to Next Paint)"><span class="num">051</span><div class="txt"><button class="term" type="button"><strong>INP (Interaction to Next Paint)</strong></button><span class="def">How fast a page reacts to a click or tap. Aim for under 200 milliseconds.</span></div><button class="show" type="button">Show meaning</button></div></li><li class="gr" data-id="cls-cumulative-layout-shift" data-text="cls (cumulative layout shift)"><div class="rin"><input type="checkbox" title="I know this term" aria-label="I know CLS (Cumulative Layout Shift)"><span class="num">052</span><div class="txt"><button class="term" type="button"><strong>CLS (Cumulative Layout Shift)</strong></button><span class="def">How much the layout jumps around while loadi function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400)}
function modal(title,body,okLabel,onOk,danger){
 $('#modalbox').innerHTML=`<h3>${esc(title)}</h3><p class="sub">${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn o" id="mno">Cancel</button><button class="btn ${danger?'d':'p'}" id="mok">${esc(okLabel)}</button></div>`;
 $('#modal').classList.remove('hidden');
 $('#mno').onclick=()=>$('#modal').classList.add('hidden');
 $('#mok').onclick=async()=>{$('#modal').classList.add('hidden');await onOk()};
}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){toast('Copy blocked here. Select the text and copy it.')}}
function linkSave(filename,data){
 try{const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return true}catch(e){return false}}

async function save(filename,data){
 if(!S.downloads&&inAppWindow()){noDlBox();return}
 if(!S.downloads){if(linkSave(filename,data)){toast('Downloading '+filename+'. Press Ctrl+J to check.');if(typeof track==='function')track('download',filename)}else toast('Downloads are blocked in this window. Open SEO Studio in the Claude web or desktop chat instead.');return}
 try{await S.downloads.save({filename,data});toast('Saved '+filename);if(typeof track==='function')track('download',filename)}
 catch(e){if(e&&e.code==='declined')return;if(linkSave(filename,data)){toast('Downloading '+filename);return}toast('Could not save: '+((e&&e.message)||(e&&e.code)||'unknown error'))}
}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function fmtDate(s){try{return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return s}}
function pct(v){return v==null?'-':Math.round(v*100)+'%'}
function domainOf(u){try{if(!/^https?:\/\//i.test(u))u='http://'+u;return new URL(u).hostname.toLowerCase().replace(/^www\./,'')}catch(e){return ''}}
function safeUrl(u){return /^https:\/\//i.test(u)?u:null}
function norm(s){s=String(s||'').toLowerCase().replace(/\.(com|in|co|io|net|org|ai)(\.[a-z]{2})?\b/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\b(pvt|private|ltd|limited|llp|llc|inc|the)\b/g,' ');return s.replace(/\s+/g,' ').trim()}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))])}
function splitList(s){return String(s||'').split(/[\n,]+/).map(x=>x.trim()).filter(Boolean)}
function cur(){return S.projects.find(p=>p.id===S.curId)||null}
function auditsOf(pid){return S.audits.filter(a=>a.projectId===pid).sort((a,b)=>b.ts-a.ts)}

 }}
 try{localStorage.setItem(LS+key,JSON.stringify(obj));return true}catch(e){toast('Could not save in this browser');return false}

async function loadAll(){
 let docs=[];
 if(S.mode==='db'){
  try{const snap=await withTimeout(col().get(),10000);docs=snap.docs.map(d=>{let x=null;try{x=JSON.parse(JSON.stringify(d.data()))}catch(e){}return{id:d.id,data:x}})}
  catch(e){S.mode='local';banner('Your saved data could not be reached, so this visit saves to this browser only. Reload later to see your saved projects.')}
 }
 if(S.mode==='db'&&!docs.length){const ld=localDocs();if(ld.some(d=>d.id==='profile')){S.mode='local';S.dbBlocked=true;docs=ld;banner('Your work is saved in this browser only. Ask your admin to give you edit access to keep it with your Claude account.')}}
 else if(S.mode==='local')docs=localDocs();

/* ---------------- metrics ---------------- */
function enrich(a){
 const ctx=a.ctx||{},own=ctx.domain||'';
 const al=[ctx.company,own,own.split('.')[0]].concat(ctx.aliases||[]).map(norm).filter(x=>x&&x.length>=3);
 (a.rows||[]).forEach(r=>{
  r.intent=LEGACY[r.intent]||r.intent||'custom';
  let pos=null;const names=[];
  (r.mentions||[]).forEach(n=>{const nn=norm(n);const hit=al.some(x=>nn===x||nn.split(' ').indexOf(x)>-1||(x.indexOf(' ')>-1&&nn.indexOf(x)>-1));if(hit&&pos==null)pos=names.length+1;names.push({name:n,own:hit})});
  r._names=names;r._comp=names.filter(x=>!x.own).map(x=>x.name);r._pos=pos;r._named=pos!=null;
  r._cites=(r.citations||[]).map(c=>{const u=typeof c==='string'?c:(c&&c.url)||'';const d=domainOf(u);return{url:u,domain:d,own:!!d&&!!own&&(d===own||d.endsWith('.'+own))}});
  r._cited=r._cites.some(c=>c.own);r._vis=r._named||r._cited;
 });
 return a;
}
function metrics(rows){
 const a=rows.filter(r=>r.status==='ok');if(!a.length)return null;
 const vis=a.filter(r=>r._vis),pos=a.filter(r=>r._pos).map(r=>r._pos);
 const presence=vis.length/a.length;
 const quality=vis.length?vis.reduce((s,r)=>s+(r._pos?1/r._pos:0.5),0)/vis.length:0;
 const citation=a.filter(r=>r._cited).length/a.length;
 const ownM=a.filter(r=>r._named).length,allM=ownM+a.reduce((s,r)=>s+r._comp.length,0);
 const sents=a.filter(r=>r._named&&r.sentiment).map(r=>r.sentiment);
 const net=sents.length?Math.round(100*(sents.filter(s=>s==='positive').length-sents.filter(s=>s==='negative').length)/sents.length):null;
 return{n:a.length,presence,named:ownM/a.length,citation,sov:allM?ownM/allM:0,avgPos:pos.length?pos.reduce((s,x)=>s+x,0)/pos.length:null,net,score:Math.round(100*(0.5*presence+0.3*presence*quality+0.2*citation))};
}
function leaderboard(rows){
 const ok=rows.filter(r=>r.status==='ok'),st={};
 ok.forEach(r=>{const seen={};r._names.forEach((n,i)=>{const k=norm(n.name);if(!k||seen[k])return;seen[k]=1;const s=st[k]||(st[k]={resp:0,pos:[],names:{},own:false});s.resp++;s.pos.push(i+1);s.names[n.name]=(s.names[n.name]||0)+1;s.own=s.own||n.own})});
 const total=Object.values(st).reduce((s,x)=>s+x.resp,0)||1;
 const out=Object.keys(st).map(k=>{const s=st[k];const name=Object.keys(s.names).sort((a,b)=>s.names[b]-s.names[a])[0];return{key:k,name,own:s.own,resp:s.resp,vis:s.resp/Math.max(1,ok.length),sov:s.resp/total,avgPos:s.pos.reduce((a,b)=>a+b,0)/s.pos.length}});
 out.sort((a,b)=>b.resp-a.resp||a.avgPos-b.avgPos);out.forEach((x,i)=>x.rank=i+1);return out;
}
function groupRate(rows,key){
 const g={};rows.filter(r=>r.status==='ok').forEach(r=>{const k=r[key]||'other';const x=g[k]||(g[k]={n:0,vis:0,named:0,cited:0});x.n++;if(r._vis)x.vis++;if(r._named)x.named++;if(r._cited)x.cited++});
 return Object.keys(g).map(k=>({k,n:g[k].n,vis:g[k].vis/g[k].n,named:g[k].named/g[k].n,cited:g[k].cited/g[k].n})).sort((a,b)=>b.vis-a.vis);
}
function sourceStats(rows){
 const st={};rows.filter(r=>r.status==='ok').forEach(r=>{const seen={};r._cites.forEach(c=>{if(!c.domain||seen[c.domain])return;seen[c.domain]=1;const s=st[c.domain]||(st[c.domain]={d:c.domain,n:0,own:c.own});s.n++})});

function gauge(score){

function donut(parts){
 const tot=parts.reduce((s,p)=>s+p.v,0)||1,R=52,C=2*Math.PI*R;let acc=0;
 const segs=parts.map(p=>{const len=C*p.v/tot;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=len;return s}).join('');

function trend(points){
 if(points.length<2)return '<p class="sub">Run at least two audits to see a trend.</p>';
 const W=560,H=150,p=28,mx=100,step=(W-2*p)/(points.length-1);
 const xy=points.map((v,i)=>[p+i*step,H-p-(H-2*p)*v.s/mx]);
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><polyline fill="none" stroke="#5E42C0" stroke-width="3" points="${xy.map(a=>a.join(',')).join(' ')}"/>${xy.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="4.5" fill="#5E42C0"/><text x="${a[0]}" y="${a[1]-10}" text-anchor="middle" font-size="11" font-weight="700">${points[i].s}</text><text x="${a[0]}" y="${H-6}" text-anchor="middle" font-size="10" fill="#6B6880">${esc(points[i].l)}</text>`).join('')}</svg>`;
}
function delta(curv,prev,isPct,lowerBetter){
 if(prev==null||curv==null)return '<div class="d flat">First run</div>';
 let d=curv-prev;if(lowerBetter)d=-d;const show=isPct?Math.round((curv-prev)*100)+' pts':(Math.round((curv-prev)*10)/10);

function track(type,detail){try{trackIn(type,detail)}catch(e){}}

 if(!ACT.data)return;
 if(type==='open'){if(ACT.lastOpen===detail)return;ACT.lastOpen=detail}
 const now=Date.now();const ev={t:now,type,detail:String(detail||'').slice(0,140)};

 <div class="card"><h3>Users by company</h3>${donut(Object.entries(coC).map(([l,v],i)=>({l,v,c:cols[i%cols.length]})))}</div></div>
 <div class="card"><h3>Users</h3><div style="overflow-x:auto"><table class="t"><tr><th>User</th><th>Company</th><th>First seen</th><th>Last active</th><th>App opens</th><th>Devices</th><th>Audits</th><th>AI uses</th><th>Downloads</th><th>Most used tool</th><th></th></tr>

 ${ADM.filter?admDevicesHTML():''}<div class="card"><div class="row" style="justify-content:space-between"><h3>Activity${ADM.filter?' for <span id="ad_fn"></span>':''}</h3><input id="ad_q" placeholder="Search activity" style="max-width:240px"></div>
 <div style="overflow-x:auto"><table class="t"><tr><th>Time</th><th>User</th><th>Company</th><th>Action</th></tr>${shown.map(e=>`<tr><td style="white-space:nowrap">${fdt(e.t)}</td><td data-n="${esc(e.uid)}"></td><td>${esc(e.co||(admReq(e.uid)||{}).company||'-')}</td><td>${esc(actText(e))}</td></tr>`).join('')}</table></div>
 <p class="sub" style="margin-top:8px">Showing ${shown.length} of ${feed.length} events. Each user keeps their latest 300 events.</p></div>`;
 $$('#ad_body [data-n]').forEach(td=>{td.textContent=admName(td.dataset.n);const em=admEmail(td.dataset.n);if(em){const sm=document.createElement('div');sm.style.cssText='font-size:12px;color:var(--mut)';sm.textContent=em;td.appendChild(sm)}});wire();
 if($('#ad_fn'))$('#ad_fn').textContent=admName(ADM.filter);if($('#ad_dn'))$('#ad_dn').textContent=admName(ADM.filter);
 const q=$('#ad_q');q.value=ADM.q;q.oninput=()=>{ADM.q=q.value;const pos=q.selectionStart;admRender();const n=$('#ad_q');n.focus();n.setSelectionRange(pos,pos)};

async function nextOb(){

  S.profile={name:OB.p.name,role:OB.p.role,level:OB.p.level,createdAt:S.profile&&S.profile.createdAt||Date.now()};
  if(!(await put('profile',S.profile)))return;renderSide();
  if(S.projects.length){location.hash='profile';route();return}
  OB.step=2;OB.pr={};drawOb();return}

  if(!/^https?:\/\//i.test(OB.pr.website))OB.pr.website='https://'+OB.pr.website;OB.pr.domain=d;OB.step=3;drawOb();return}

 }
}

async function runQuick(qs){
 const p=cur();
 S.run={pid:p.id,qs,done:0,rows:[],log:[],ctrl:new AbortController(),start:Date.now()};drawRun();
 for(let i=0;i<qs.length;i++){
  if(!S.run||S.run.ctrl.signal.aborted)break;
  const q=qs[i];S.run.now=q.query;drawRun();
  const prompt=`A person asked an AI assistant this question:
"${q.query}"
First, answer it the way you normally would for that person, using what you know. You have no web access. Name specific businesses where a helpful answer would.
Then report on your own answer. Return JSON only:
{"answer":"your full answer, under 170 words","brands":[{"name":"each business or brand you named, in the order you first named it. Leave out directories, review sites, marketplaces and publications","tone":"positive, neutral or negative: how your answer describes it"}],"sources":["every website URL you mentioned, as full https URLs"]}`;
  let row={query:q.query,intent:q.intent,topic:q.topic||'',platform:'Claude (in app)',status:'ok',mentions:[],citations:[],sentiment:null,excerpt:''};
  try{const r=await ask(prompt,{signal:S.run.ctrl.signal});
   const br=(r&&Array.isArray(r.brands))?r.brands:[];
   row.mentions=br.map(b=>typeof b==='string'?b:(b&&b.name)).filter(Boolean).map(String).slice(0,20);
   row._tones=br.map(b=>b&&b.tone);
   row.citations=((r&&r.sources)||[]).filter(u=>typeof u==='string'&&/^https?:\/\//i.test(u)).slice(0,10).map(u=>({url:u}));
   row.excerpt=String((r&&r.answer)||'').slice(0,700);
   S.run.log.unshift('✓ '+q.query);
  }catch(e){if(e&&(e.name==='AbortError'||e.code==='aborted'||e.code==='cancelled'))break;row.status='no_answer';S.run.log.unshift('✕ '+q.query+' ('+aiErr(e)+')');if(e&&(e.code==='not_granted'||e.code==='no_ai')){S.run.rows.push(row);break}if(e&&e.code==='rate_limited')await new Promise(r=>setTimeout(r,20000))}
  S.run.rows.push(row);S.run.done=i+1;drawRun();
 }
 const run=S.run;S.run=null;if(!run)return;
 const rows=run.rows;
 if(!rows.some(r=>r.status==='ok')){toast('No answers came back, so nothing was saved');if(location.hash.slice(1)==='checker'||!location.hash)route();return}
 const ctx={company:p.name,domain:p.domain,website:p.website,industry:p.industry,location:p.city,date:today(),aliases:p.aliases||[]};
 const tmp=enrich({ctx,rows:rows.map(r=>Object.assign({},r))});
 tmp.rows.forEach((r,i)=>{if(r._named){const idx=r._names.findIndex(n=>n.own);const t=rows[i]._tones&&rows[i]._tones[idx];rows[i].sentiment=['positive','neutral','negative'].indexOf(t)>-1?t:'neutral'}delete rows[i]._tones});
 const a={id:'a'+uid(),projectId:p.id,ts:Date.now(),date:today(),source:'quick',ctx,platforms:['Claude (in app)'],queries:run.qs.slice(0,rows.length),rows};
 if(await put('audit_'+a.id,a)){S.audits.push(a);toast('Audit saved');track('audit',p.domain+' ('+rows.length+' questions)')}
 if(cur()&&cur().id===p.id&&(location.hash.slice(1)||'checker')==='checker')route();
}

 return t.replace(/\{brand\}/g,p.name).replace(/\{city\}/g,(parts[0]||'my city').trim()).replace(/\{country\}/g,(parts[1]||parts[0]||'India').trim()).replace(/\{industry\}/g,p.industry||'agency').replace(/\{service\}/g,sv[i%sv.length]).replace(/\{competitor\}/g,(p.competitors&&p.competitors[0])||'a competitor').replace(/\{customer\}/g,(p.customers||'small businesses').split(',')[0].trim())}

function parseRobots(t){const groups=[];let g=null,last='';t.split(/\r?\n/).forEach(l=>{l=l.replace(/#.*/,'').trim();if(!l)return;const i=l.indexOf(':');if(i<0)return;const k=l.slice(0,i).trim().toLowerCase(),v=l.slice(i+1).trim();
 if(k==='user-agent'){if(!g||last!=='ua'){g={agents:[],rules:[]};groups.push(g)}g.agents.push(v.toLowerCase());last='ua'}
 else if((k==='allow'||k==='disallow')&&g){g.rules.push({type:k,path:v});last='r'}else last='o'});return groups}
function robotsCheck(groups,ua,path){
 ua=ua.toLowerCase();let gs=groups.filter(g=>g.agents.some(a=>a!=='*'&&ua.indexOf(a)===0||a===ua));

function vNap(m){
 const p=cur();
 m.innerHTML=`<div class="card"><h2>NAP consistency checker</h2><p class="sub">Compare your Name, Address and Phone across listings. Paste what each directory shows.</p>
 <div class="grid g3"><div class="fld"><label>Correct name</label><input type="text" id="np_n" value="${esc(p.name)}"></div><div class="fld"><label>Correct address</label><input type="text" id="np_a"></div><div class="fld"><label>Correct phone</label><input type="text" id="np_p"></div></div>
 <div class="fld"><label>Listings: Source | Name | Address | Phone, one per line</label><textarea id="np_l" class="mono" placeholder="Justdial | Your Business | 12 MG Road, Bangalore | +91 98450 00000&#10;Google | Eflot | 12, M.G. Road, Bengaluru | 098450 00000"></textarea></div><button class="btn p" id="np_go">Check listings</button></div><div id="np_out"></div>`;
 $('#np_go').onclick=()=>{const N=norm(val('np_n')),A=norm(val('np_a').replace(/bengaluru/gi,'bangalore')),P=val('np_p').replace(/\D/g,'').slice(-10);
  const tok=s=>new Set(s.split(' ').filter(Boolean));const sim=(a,b)=>{const x=tok(a),y=tok(b);if(!x.size||!y.size)return 0;let i=0;x.forEach(t=>{if(y.has(t))i++});return i/new Set([...x,...y]).size};
  const rows=$('#np_l').value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x.length>=2);
  const res=rows.map(r=>{const n=norm(r[1]),a=norm((r[2]||'').replace(/bengaluru/gi,'bangalore')),ph=(r[3]||'').replace(/\D/g,'').slice(-10);return{src:r[0],n:r[1],a:r[2]||'',p:r[3]||'',on:n===N,oa:!A||sim(a,A)>=0.8,op:!P||ph===P,pa:sim(a,A)}});
  const mk=(ok,soft)=>ok?'<span class="pill ok">Match</span>':soft?'<span class="pill warn">Close</span>':'<span class="pill bad">Fix</span>';
  $('#np_out').innerHTML=`<div class="card"><div class="row"><h3>Results</h3><span class="sp"></span><span class="pill ${res.every(r=>r.on&&r.oa&&r.op)?'ok':'warn'}">${res.filter(r=>r.on&&r.oa&&r.op).length} of ${res.length} fully consistent</span></div><div class="tw"><table class="t"><thead><tr><th>Source</th><th>Name</th><th>Address</th><th>Phone</th></tr></thead><tbody>${res.map(r=>`<tr><td><b>${esc(r.src)}</b></td><td>${mk(r.on,norm(r.n).indexOf(N)>-1)} ${esc(r.n)}</td><td>${mk(r.oa,r.pa>=0.5)} ${esc(r.a)}</td><td>${mk(r.op)} ${esc(r.p)}</td></tr>`).join('')}</tbody></table></div><p class="sub" style="margin-top:10px">Use the exact same name, address format and phone everywhere. Google trusts listings that agree.</p></div>`};
}

/* ---------------- PageSpeed and Core Web Vitals ---------------- */
const CWV={lcp:[2.5,4,'s','LCP','Largest Contentful Paint: how fast the main content shows'],inp:[200,500,'ms','INP','Interaction to Next Paint: how fast the page reacts to a tap or click'],cls:[0.1,0.25,'','CLS','Cumulative Layout Shift: how much the page jumps while loading']};
function cwvGrade(k,v){if(v===''||v==null||isNaN(v))return null;const c=CWV[k];return v<=c[0]?'ok':v<=c[1]?'warn':'bad'}
function cwvPerf(v){if(v===''||v==null||isNaN(v))return null;return v>=90?'ok':v>=50?'warn':'bad'}
const CWVL={ok:'Good',warn:'Needs work',bad:'Poor'};
function psUrl(u,dev){return 'https://pagespeed.web.dev/analysis?url='+encodeURIComponent(u)+'&form_factor='+(dev==='desktop'?'desktop':'mobile')}

function cwvParse(txt){
 const s=txt.replace(/ /g,' ').replace(/[ \t]+/g,' ');
 const num=x=>Number(String(x).replace(/,/g,''));
 const grab=(re)=>{const m=s.match(re);return m?{v:num(m[1]),u:(m[2]||'').toLowerCase()}:null};
 const sec=(o)=>!o?'':(o.u==='ms'?o.v/1000:o.v);
 const ms=(o)=>!o?'':(o.u==='s'?o.v*1000:o.v);
 const G='[^0-9]{0,40}?';
 const fL=grab(new RegExp('Largest Contentful Paint \\(LCP\\)'+G+'([0-9][0-9.,]*)\\s*(ms|s)\\b','i'));
 const fI=grab(new RegExp('Interaction to Next Paint \\(INP\\)'+G+'([0-9][0-9.,]*)\\s*(ms|s)\\b','i'));
 const fC=grab(new RegExp('Cumulative Layout Shift \\(CLS\\)'+G+'([0-9][0-9.]*)','i'));
 const lL=grab(new RegExp('Largest Contentful Paint(?! \\(LCP\\))'+G+'([0-9][0-9.,]*)\\s*(ms|s)\\b','i'));
 const lC=grab(new RegExp('Cumulative Layout Shift(?! \\(CLS\\))'+G+'([0-9][0-9.]*)','i'));
 let perf=null;const pm=s.match(/(?:^|\s)(\d{1,3})\s*Performance\b/);if(pm&&num(pm[1])<=100)perf=num(pm[1]);
 const field=!!(fL||fI||fC);
 const out={lcp:field?sec(fL):sec(lL),inp:field?ms(fI):'',cls:field?(fC?fC.v:''):(lC?lC.v:''),perf:perf==null?'':perf,src:field?'field':'lab'};
 if(/mobile/i.test(s)&&/desktop/i.test(s)){}
 return out;
}

/* ---------------- Site audit crawler (Screaming Frog style) ----------------
   Runs only in the installed desktop app: pages are fetched with curl on the
   person's computer (built into Windows 10+, macOS and Linux). */
const CR={st:null,tab:'issues',filter:'',q:'',sel:null};
const CR_UA='Mozilla/5.0 (compatible; EflotSEOStudio/1.0; +https://eflot.com)';
const CR_SKIP=/\.(jpe?g|png|gif|webp|svg|ico|bmp|avif|tiff?|pdf|docx?|xlsx?|pptx?|zip|rar|7z|gz|mp4|mp3|webm|mov|avi|wav|css|js|json|xml|txt|woff2?|ttf|eot|exe|dmg|apk)(\?|$)/i;
const CR_IMG=/\.(jpe?g|png|gif|webp|svg|ico|bmp|avif)(\?|$)/i;

function crNorm(u,base){try{const x=new URL(u,base);if(!/^https?:$/.test(x.protocol))return null;x.hash='';
 if((x.protocol==='https:'&&x.port==='443')||(x.protocol==='http:'&&x.port==='80'))x.port='';return x.href}catch(e){return null}}
function crHost(u){try{return new URL(u).hostname.toLowerCase()}catch(e){return''}}
function crBare(h){return h.replace(/^www\./,'')}

/* one HTTP request through curl; never follows redirects so each hop is recorded */
function crCurl(url,body){
 return new Promise(res=>{
  const d=S.desktop;const t0=Date.now();
  const nul=CR.st&&CR.st.win?'NUL':'/dev/null';
  const args=['-sS','--compressed','--max-time','25','--connect-timeout','10','-A',CR_UA,'-H','Accept: text/html,application/xhtml+xml,*/*;q=0.8','-D','-','-o',body?'-':nul,
   '-w','\n@@EFL@@%{http_code}|%{redirect_url}|%{time_starttransfer}|%{time_total}|%{size_download}|%{content_type}',url];
  let out='',err='',big=false,done=false;
  let p;try{p=d.childProcess.spawn(CR.st&&CR.st.win?'curl.exe':'curl',args)}catch(e){res({url,code:0,error:'Could not start curl: '+(e.message||e)});return}
  CR.st&&CR.st.procs.add(p);
  const fin=r=>{if(done)return;done=true;CR.st&&CR.st.procs.delete(p);res(r)};
  p.stdout.on('data',c=>{out+=c;if(out.length>6e6&&!big){big=true;p.kill().catch(()=>{})}});
  p.stderr.on('data',c=>{err+=c});
  p.on('error',e=>fin({url,code:0,error:String(e&&e.message||e)}));
  p.on('close',code=>{
   const i=out.lastIndexOf('\n@@EFL@@');
   if(i<0){fin({url,code:0,error:big?'Page larger than 6 MB':(err.trim()||('curl exit '+code)),ms:Date.now()-t0});return}
   const m=out.slice(i+8).split('|');let raw=out.slice(0,i);
   // split header block(s) from body
   let headers={};const hb=raw.match(/^HTTP\/[\d.]+ \d+[^\n]*\n([\s\S]*?)\r?\n\r?\n/);
   if(hb){hb[1].split(/\r?\n/).forEach(l=>{const k=l.indexOf(':');if(k>0)headers[l.slice(0,k).trim().toLowerCase()]=l.slice(k+1).trim()});raw=raw.slice(hb[0].length)}
   fin({url,code:Number(m[0])||0,location:m[1]||'',ttfb:Math.round(Number(m[2])*1000),ms:Math.round(Number(m[3])*1000),size:Number(m[4])||0,ctype:(m[5]||'').toLowerCase(),headers,body:body?raw:'',error:code&&!Number(m[0])?(err.trim()||'curl exit '+code):''});
  });
 });
}

function crParse(html,url){
 const doc=new DOMParser().parseFromString(html,'text/html');
 const q=s=>[...doc.querySelectorAll(s)];
 const txt=e=>(e.textContent||'').replace(/\s+/g,' ').trim();
 const titles=q('title').map(txt);
 const metas=n=>q('meta[name]').filter(m=>m.getAttribute('name').toLowerCase()===n).map(m=>(m.getAttribute('content')||'').trim());
 const canon=q('link[rel]').filter(l=>l.getAttribute('rel').toLowerCase().split(/\s+/).includes('canonical')).map(l=>crNorm(l.getAttribute('href')||'',url)).filter(Boolean);
 const hreflang=q('link[rel="alternate"][hreflang]').map(l=>({lang:l.getAttribute('hreflang'),href:crNorm(l.getAttribute('href')||'',url)})).filter(x=>x.href);
 const types=[];q('script[type="application/ld+json"]').forEach(s=>{try{const j=JSON.parse(s.textContent);const walk=o=>{if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(walk);return}const t=o['@type'];if(t)[].concat(t).forEach(x=>types.push(String(x)));if(o['@graph'])walk(o['@graph'])};walk(j)}catch(e){types.push('Invalid JSON-LD')}});
 const micro=q('[itemtype]').length;
 const links=q('a[href]').map(a=>{const h=a.getAttribute('href')||'';return{href:crNorm(h,url),raw:h,text:txt(a).slice(0,100)||(a.querySelector('img[alt]')?('[img] '+a.querySelector('img[alt]').getAttribute('alt')):''),nofollow:/nofollow/i.test(a.getAttribute('rel')||'')}}).filter(l=>l.href);
 const imgs=q('img').map(i=>({src:crNorm(i.getAttribute('src')||i.getAttribute('data-src')||'',url),alt:i.hasAttribute('alt')?(i.getAttribute('alt')||''):null})).filter(i=>i.src);
 const mixed=url.startsWith('https:')?q('img[src^="http:"],script[src^="http:"],link[rel=stylesheet][href^="http:"],iframe[src^="http:"]').length:0;
 q('script,style,noscript,template,svg').forEach(e=>e.remove());
 const bodyTxt=doc.body?txt(doc.body):'';
 const words=bodyTxt?bodyTxt.split(' ').filter(w=>/[\p{L}\p{N}]/u.test(w)).length:0;
 let h=0;const norm=bodyTxt.toLowerCase();for(let i=0;i<norm.length;i++){h=(h*31+norm.charCodeAt(i))|0}
 const refresh=q('meta[http-equiv]').some(m=>m.getAttribute('http-equiv').toLowerCase()==='refresh');
 return{titles,descs:metas('description'),robots:metas('robots').concat(metas('googlebot')).join(', ').toLowerCase(),canon,
  h1:q('h1').map(txt),h2:q('h2').map(txt),lang:(doc.documentElement.getAttribute('lang')||'').trim(),viewport:metas('viewport').length>0,
  hreflang,types:[...new Set(types)],micro,links,imgs,mixed,words,hash:words>20?String(h):'',refresh,ogTitle:!!q('meta[property="og:title"]').length};
}
