function crRows(tab){
 const st=CR.st;const P=[...st.pages.values()];const H=P.filter(p=>p.titles);
 const kb=n=>n?Math.round(n/1024)+' KB':'';
 const T=(cols,rows,filters)=>({cols,rows,filters:filters||[]});
 const inl=u=>(st.inlinks.get(u)||[]).length;
 switch(tab){
  case 'internal':return T(['Address','Status','Indexable','Reason','Title','Words','Depth','Inlinks','Outlinks','Response (ms)','Size'],P.map(p=>[p.url,p.status,p.code?(p.indexable?'Yes':'No'):'No',p.reason,(p.titles||[])[0]||'',p.words||'',p.depth==null?'':p.depth,inl(p.url),p.outInt||'',p.ms,kb(p.size)]),[['HTML',r=>/^\d/.test(r[1])&&r[4]!==''||r[5]!==''],['Indexable',r=>r[2]==='Yes'],['Non-indexable',r=>r[2]==='No']]);
  case 'external':return T(['Address','Status','Inlinks'],[...st.ext.values()].map(e=>[e.url,e.code==null?'Not checked':e.code||('Error '+(e.error||'')),inl(e.url)]),[['Broken',r=>/^[45]|Error/.test(String(r[1]))],['Not checked',r=>r[1]==='Not checked']]);
  case 'response':return T(['Address','Status','Redirect to','Inlinks','Response (ms)'],P.map(p=>[p.url,p.status,p.redirect||'',inl(p.url),p.ms]),[['2xx',r=>/^2/.test(r[1])],['3xx',r=>/^3/.test(r[1])],['4xx',r=>/^4/.test(r[1])],['5xx',r=>/^5/.test(r[1])],['No response',r=>/^Error/.test(r[1])],['Blocked',r=>/Blocked/.test(r[1])]]);
  case 'security':return T(['Address','Protocol','Mixed content','HSTS'],H.map(p=>[p.url,p.url.split(':')[0].toUpperCase(),p.mixed||'',p.hsts?'Yes':'No']),[['HTTP',r=>r[1]==='HTTP'],['Mixed content',r=>r[2]]]);
  case 'url':return T(['Address','Length','Issue'],P.map(p=>{const pa=(()=>{try{const x=new URL(p.url);return x.pathname+x.search}catch(e){return''}})();return[p.url,p.url.length,[/[A-Z]/.test(pa)&&'Uppercase',/_/.test(pa)&&'Underscores',/\?/.test(pa)&&'Parameters',p.url.length>115&&'Over 115'].filter(Boolean).join(', ')]}),[['Has issue',r=>r[2]]]);
  case 'titles':return T(['Address','Title','Length','Count'],H.map(p=>[p.url,p.titles[0]||'',(p.titles[0]||'').length,p.titles.length]),[['Missing',r=>!r[1]],['Over 60',r=>r[2]>60],['Below 30',r=>r[1]&&r[2]<30]]);
  case 'meta':return T(['Address','Meta description','Length'],H.map(p=>[p.url,p.descs[0]||'',(p.descs[0]||'').length]),[['Missing',r=>!r[1]],['Over 155',r=>r[2]>155],['Below 70',r=>r[1]&&r[2]<70]]);
  case 'h1':return T(['Address','H1-1','H1-2','Count','Length'],H.map(p=>[p.url,p.h1[0]||'',p.h1[1]||'',p.h1.length,(p.h1[0]||'').length]),[['Missing',r=>!r[3]],['Multiple',r=>r[3]>1],['Over 70',r=>r[4]>70]]);
  case 'h2':return T(['Address','H2-1','H2-2','Count'],H.map(p=>[p.url,p.h2[0]||'',p.h2[1]||'',p.h2.length]),[['Missing',r=>!r[3]]]);
  case 'content':return T(['Address','Words','Response (ms)','First byte (ms)','Size'],H.map(p=>[p.url,p.words,p.ms,p.ttfb,kb(p.size)]),[['Under 200 words',r=>r[1]<200],['Slow (over 1 s)',r=>r[3]>1000]]);
  case 'images':return T(['Image','Status','Size','Missing alt on','Example alt'],[...st.imgs.values()].filter(i=>i.alts.length).map(i=>[i.url,i.code==null?'Not checked':i.code||'Error',kb(i.size),i.alts.filter(a=>!a.alt).length||'',(i.alts.find(a=>a.alt)||{}).alt||'']),[['Missing alt',r=>r[3]],['Over 100 KB',r=>parseInt(r[2])>100],['Broken',r=>/^[45]|Error/.test(String(r[1]))]]);
  case 'canonicals':return T(['Address','Canonical','Status'],H.map(p=>[p.url,p.canonical||'',!p.canon.length?'Missing':p.canonicalised?'Canonicalised':'Self-referencing']),[['Missing',r=>r[2]==='Missing'],['Canonicalised',r=>r[2]==='Canonicalised'],['Self-referencing',r=>r[2]==='Self-referencing']]);
  case 'directives':return T(['Address','Meta robots','X-Robots-Tag','Indexable'],H.map(p=>[p.url,p.robots,p.xrobots||'',p.indexable?'Yes':'No']),[['Noindex',r=>/noindex|none/.test(r[1]+r[2])],['Nofollow',r=>/nofollow|none/.test(r[1]+r[2])]]);
  case 'hreflang':return T(['Address','Hreflang values','Count'],H.filter(p=>p.hreflang.length).map(p=>[p.url,p.hreflang.map(x=>x.lang).join(', '),p.hreflang.length]));
  case 'structured':return T(['Address','Schema types','Microdata items'],H.map(p=>[p.url,p.types.join(', '),p.micro||'']),[['Missing',r=>!r[1]&&!r[2]],['Has schema',r=>r[1]||r[2]]]);
  case 'mobile':return T(['Address','Viewport','Lang'],H.map(p=>[p.url,p.viewport?'Yes':'Missing',p.lang||'Missing']),[['Missing viewport',r=>r[1]==='Missing']]);
  case 'links':return T(['Address','Depth','Inlinks','Internal outlinks','External outlinks'],H.map(p=>[p.url,p.depth==null?'':p.depth,inl(p.url),p.outInt,p.outExt]),[['Depth over 3',r=>r[1]>3],['No outlinks',r=>!r[3]],['1 inlink or less',r=>r[2]<=1]]);
  case 'sitemaps':return T(['URL in sitemap','Crawled status','Indexable','Inlinks'],[...st.sitemap].map(u=>{const p=st.pages.get(u);return[u,p?p.status:'Not crawled',p?(p.indexable?'Yes':'No'):'',inl(u)]}),[['Non-indexable',r=>r[2]==='No'],['Orphans',r=>!r[3]]]);
 }
 return T([],[]);
}

const GT={files:[]};
function gtU8(s){return new TextEncoder().encode(s)}

function gtIFD(entries,start){
 // entries: {tag,type,count,data:Uint8Array}; returns {bytes, size}

function gtLong(v){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v,true);return b}
function gtAscii(s){const u=gtU8(s);const b=new Uint8Array(u.length+1);b.set(u);return b}
function gtExif(md){

 if(md.author)e0.push({tag:0x013B,type:2,data:gtAscii(md.author)});
 if(md.copyright)e0.push({tag:0x8298,type:2,data:gtAscii(md.copyright)});
 if(md.title)e0.push({tag:0x9C9B,type:1,data:gtU16(md.title)});
 if(md.desc)e0.push({tag:0x9C9C,type:1,data:gtU16(md.desc)});
 if(md.keywords.length)e0.push({tag:0x9C9E,type:1,data:gtU16(md.keywords.join(';'))});
 if(md.title)e0.push({tag:0x9C9F,type:1,data:gtU16(md.title)});
 const hasGps=md.lat!=null&&md.lng!=null;
 if(hasGps)e0.push({tag:0x8825,type:4,count:1,data:gtLong(0)});
 e0.forEach(e=>{if(e.count==null)e.count=e.data.length});
 let ifd0=gtIFD(e0.map(x=>Object.assign({},x)),8);
 let gps=null;
 if(hasGps){const gOff=8+ifd0.length;
  e0.find(x=>x.tag===0x8825).data=gtLong(gOff);ifd0=gtIFD(e0.map(x=>Object.assign({},x)),8);
  const g=[{tag:0,type:1,count:4,data:new Uint8Array([2,3,0,0])},{tag:1,type:2,count:2,data:gtAscii(md.lat<0?'S':'N')},{tag:2,type:5,count:3,data:gtRat(gtDMS(md.lat))},{tag:3,type:2,count:2,data:gtAscii(md.lng<0?'W':'E')},{tag:4,type:5,count:3,data:gtRat(gtDMS(md.lng))}];

function gtXmlEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function gtXmp(md){

 +(md.desc?`<dc:description><rdf:Alt><rdf:li xml:lang="x-default">${gtXmlEsc(md.desc)}</rdf:li></rdf:Alt></dc:description>`:'')
 +(md.keywords.length?`<dc:subject><rdf:Bag>${md.keywords.map(k=>`<rdf:li>${gtXmlEsc(k)}</rdf:li>`).join('')}</rdf:Bag></dc:subject>`:'')
 +(md.author?`<dc:creator><rdf:Seq><rdf:li>${gtXmlEsc(md.author)}</rdf:li></rdf:Seq></dc:creator>`:'')
 +(md.copyright?`<dc:rights><rdf:Alt><rdf:li xml:lang="x-default">${gtXmlEsc(md.copyright)}</rdf:li></rdf:Alt></dc:rights>`:'')
 +(md.city?`<photoshop:City>${gtXmlEsc(md.city)}</photoshop:City>`:'')

function gtSeg(marker,payload){if(payload.length+2>65535)throw new Error('Metadata is too long. Shorten the description or keywords.');const b=new Uint8Array(4+payload.length);b[0]=0xFF;b[1]=marker;b[2]=(payload.length+2)>>8;b[3]=(payload.length+2)&255;b.set(payload,4);return b}

/* ---- split a JPEG into segments ---- */
function gtSegments(u8){
 if(u8[0]!==0xFF||u8[1]!==0xD8)throw new Error('Not a JPEG file');
 const segs=[];let p=2;
 while(p<u8.length){if(u8[p]!==0xFF){throw new Error('Damaged JPEG')}
  let mk=u8[p+1];while(mk===0xFF){p++;mk=u8[p+1]}
  if(mk===0xDA){segs.push({mk,bytes:u8.subarray(p)});break}
  if(mk===0xD9){segs.push({mk,bytes:u8.subarray(p,p+2)});break}
  if(mk>=0xD0&&mk<=0xD7||mk===0x01){segs.push({mk,bytes:u8.subarray(p,p+2)});p+=2;continue}
  const len=(u8[p+2]<<8)|u8[p+3];segs.push({mk,bytes:u8.subarray(p,p+2+len)});p+=2+len}
 return segs}
function gtIsExif(s){return s.mk===0xE1&&String.fromCharCode(...s.bytes.subarray(4,10))==='Exif\0\0'}

/* ---- read existing EXIF (title, description, GPS, orientation) ---- */
function gtRead(u8){

 if(xmp){const t=new TextDecoder().decode(xmp.bytes.subarray(33));const g=re=>{const m=t.match(re);return m?m[1].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'):''};
  out.xmpTitle=g(/<dc:title>[\s\S]*?<rdf:li[^>]*>([\s\S]*?)<\/rdf:li>/);out.xmpDesc=g(/<dc:description>[\s\S]*?<rdf:li[^>]*>([\s\S]*?)<\/rdf:li>/);

   if(type===2)r[tag]=new TextDecoder().decode(t.subarray(vo,vo+cnt)).replace(/\0+$/,'');
   else if(type===1||type===7)r[tag]=t.subarray(vo,vo+cnt);
   else if(type===3)r[tag]=u16(vo);
   else if(type===4)r[tag]=u32(vo);
   else if(type===5){const a=[];for(let k=0;k<cnt;k++)a.push([u32(vo+k*8),u32(vo+k*8+4)]);r[tag]=a}}return r};

/* ---- write metadata into a JPEG, keeping the image data untouched ---- */
function gtWrite(u8,md){

  GT.files.push({name:f.name,file:f,u8,jpg,meta,url:URL.createObjectURL(f)})}

 if(first&&!val('gt_lat')&&first.meta.lat!=null){$('#gt_lat').value=first.meta.lat.toFixed(6);$('#gt_lng').value=first.meta.lng.toFixed(6);gtMapLink()}
 gtList()}
function gtList(){const el=$('#gt_list');if(!el)return;
 el.innerHTML=GT.files.length?`<div class="row" style="margin-bottom:6px"><b>${GT.files.length} photo${GT.files.length>1?'s':''}</b><span class="sp"></span><button class="btn o sm" id="gt_clr">Clear</button></div>`+GT.files.map((f,i)=>{const md=f.meta||{};const has=[md.lat!=null&&('📍 '+md.lat.toFixed(5)+', '+md.lng.toFixed(5)),(md.title||md.xmpTitle)&&('Title: '+(md.title||md.xmpTitle)),(md.desc||md.xmpDesc)&&('Description: '+(md.desc||md.xmpDesc).slice(0,60)),(md.keywords||md.xmpKeywords)&&('Keywords: '+(md.keywords||(md.xmpKeywords||[]).join('; ')).slice(0,60)),md.model&&('Camera: '+md.make+' '+md.model)].filter(Boolean);
  return `<div class="row" style="gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)"><img src="${f.url}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px"><div style="flex:1;min-width:0"><b style="word-break:break-all">${esc(f.name)}</b> ${f.jpg?'':'<span class="pill warn">will be saved as JPG</span>'}<div class="sub" style="font-size:12px">${has.length?'Existing data: '+has.map(esc).join(' · '):'No existing location or title'}</div></div><button class="btn o sm" data-gtrm="${i}">✕</button></div>`}).join(''):'';
 const c=$('#gt_clr');if(c)c.onclick=()=>{GT.files.forEach(f=>URL.revokeObjectURL(f.url));GT.files=[];gtList()};
 $$('[data-gtrm]',el).forEach(b=>b.onclick=()=>{const f=GT.files.splice(Number(b.dataset.gtrm),1)[0];if(f)URL.revokeObjectURL(f.url);gtList()})}
async function gtRun(){
 if(!GT.files.length){toast('Add at least one photo');return}
 const la=val('gt_lat')===''?null:Number(val('gt_lat')),lo=val('gt_lng')===''?null:Number(val('gt_lng'));
 if((la==null)!==(lo==null)||(la!=null&&(isNaN(la)||isNaN(lo)||Math.abs(la)>90||Math.abs(lo)>180))){toast('Enter both latitude and longitude, or neither');return}
 const auth=val('gt_auth');
 const base={lat:la,lng:lo,title:val('gt_title'),desc:val('gt_desc'),keywords:val('gt_kw').split(/[,;\n]/).map(s=>s.trim()).filter(Boolean).slice(0,40),city:val('gt_city'),author:auth,copyright:auth?'© '+new Date().getFullYear()+' '+auth:''};
 if(la==null&&!base.title&&!base.desc&&!base.keywords.length){toast('Add a location or a title first');return}
 const ren=$('#gt_ren').checked;const used={};const res=[];
 for(const f of GT.files){
  try{const src=f.jpg?f.u8:await gtToJpeg(f.file);
   const md=Object.assign({},base,{orientation:f.jpg&&f.meta.orientation>1?f.meta.orientation:0});
   const out=gtWrite(src,md);const chk=gtRead(out);
   let nm=ren&&base.title?gtSlug(base.title):f.name.replace(/\.[^.]+$/,'');if(used[nm]){used[nm]++;nm+='-'+used[nm]}else used[nm]=1;nm+='.jpg';
   const ok=(la==null||(Math.abs(chk.lat-la)<1e-5&&Math.abs(chk.lng-lo)<1e-5))&&(!base.title||chk.title===base.title);
   res.push({nm,from:f.name,out,ok,chk,url:URL.createObjectURL(new Blob([out],{type:'image/jpeg'}))});
   }
  catch(e){res.push({nm:f.name,from:f.name,err:e.message||String(e)})}}
 track('geotag',res.length+' photos');
 GT.res=res;
 $('#gt_out').innerHTML=`<div class="card"><div class="row"><h3 style="margin:0">Ready to download</h3><span class="sp"></span>${res.filter(r=>!r.err).length>1?'<button class="btn p" id="gt_all">⬇ Download all</button>':''}</div><p class="sub" style="margin:6px 0 10px">Click <b>Download</b> on each photo. If nothing downloads, right-click the large photo below and choose <b>Save image as</b>. The location and title stay inside the file.</p><div class="tw"><table class="t"><thead><tr><th>Photo</th><th>File</th><th>Check</th><th>Location written</th><th>Title written</th><th></th></tr></thead><tbody>${res.map((r,i)=>r.err?`<tr><td></td><td>${esc(r.from)}</td><td><span class="pill bad">Failed</span></td><td colspan="3">${esc(r.err)}</td></tr>`:`<tr><td><img src="${r.url}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:8px"></td><td><b>${esc(r.nm)}</b><div class="sub">from ${esc(r.from)}</div></td><td>${r.ok?'<span class="pill ok">Verified</span>':'<span class="pill warn">Check</span>'}</td><td>${r.chk.lat!=null?esc(r.chk.lat.toFixed(6)+', '+r.chk.lng.toFixed(6)):'-'}</td><td>${esc(r.chk.title||'-')}</td><td><button class="btn p sm" data-gtdl="${i}">⬇ Download</button></td></tr>`).join('')}</tbody></table></div>
 <div class="row" style="gap:12px;flex-wrap:wrap;margin-top:14px">${res.filter(r=>!r.err).map(r=>`<figure style="margin:0;text-align:center"><img src="${r.url}" alt="${esc(r.nm)}" title="Right-click and choose Save image as" style="max-width:260px;max-height:200px;border-radius:10px;border:1px solid var(--line)"><figcaption class="sub" style="font-size:12px;max-width:260px;word-break:break-all">${esc(r.nm)}</figcaption></figure>`).join('')}</div>
 <p class="sub" style="margin-top:8px">The app read each file back after writing to confirm the data is inside. To check yourself: on Windows right-click the photo, Properties, Details; on Mac open it in Preview, Tools, Show Inspector.</p></div>`;
 const dl=r=>save(r.nm,new Blob([r.out],{type:'image/jpeg'}));
 $$('[data-gtdl]').forEach(b=>b.onclick=()=>dl(GT.res[Number(b.dataset.gtdl)]));
 const all=$('#gt_all');if(all)all.onclick=async()=>{for(const r of GT.res.filter(x=>!x.err)){await dl(r)}};
 $('#gt_out').scrollIntoView({behavior:'smooth',block:'start'});
}
